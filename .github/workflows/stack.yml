# The whole demo, on every push: the portal from its images, the demo firm
# seeded through the portal API, then every dhvaj-mcp tool driven end to end
# as the agents' own portal users. Switch is not needed for this part.
name: Stack

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax and template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every script parses
        run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - run: pip install --quiet pyyaml
      - name: The Switch template is well-formed
        run: |
          python3 - <<'EOF'
          import yaml
          t = yaml.safe_load(open('switch/dhvaj-desk.template.yaml'))
          agents = {a['name'] for a in t['agents']}
          rooms = {r['name'] for r in t['rooms']}
          for r in t['rooms']:
              missing = set(r['agents']) - agents
              assert not missing, f"#{r['name']} names unknown agents {missing}"
          for l in t['links']:
              assert {l['from'], l['to']} <= rooms, f"link {l} names an unknown room"
          print(f"{len(agents)} agents, {len(rooms)} rooms, {len(t['links'])} links")
          EOF

  stack:
    name: Portal + seed + every tool
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DB_MIGRATOR_PASSWORD: ci-migrator-password
      DB_APP_PASSWORD: ci-app-password
      AUTH_JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret-16plus
      DHVAJ_API_URL: http://localhost:3101/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: docker compose up
        run: docker compose up -d --wait postgres api web

      - name: Seed the demo story (then reset it to its start)
        run: |
          docker compose up --exit-code-from seed seed

      - name: Every Core tool, as the agents
        run: npm run test:mcp

      - name: Every Full-tier tool
        run: npm run test:full

      - name: The story resets cleanly
        run: npm run demo:reset

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200 api seed
